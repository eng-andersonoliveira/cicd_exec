# Nome do pipeline
name: CI Pipeline Básico

# Quando o pipeline será executado
on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  build-and-test:
    # Sistema operacional onde o job vai rodar
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Instalar Ansible
        run: |
          pip install ansible-core==2.17.5
          ansible-galaxy collection install -r requirements.yml
name: Pipeline Java CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    name: Compilar e testar Java
    runs-on: ubuntu-latest

    steps:
      - name: Baixar código
        uses: actions/checkout@v5

      - name: Configurar Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Verificar Java e Maven
        run: |
          java -version
          mvn -version

      - name: Compilar e executar testes
        run: mvn -B clean verify

      - name: Publicar JAR
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: aplicacao-java
          path: target/pipeline-java-1.0.0.jar
          if-no-files-found: error
